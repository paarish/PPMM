[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show detailed output by default
addopts =
    -v
    --tb=short
    --show-capture=no

# Custom markers
markers =
    slow: marks tests that make multiple API calls (may take >30s)
    connectivity: marks basic connectivity tests
    values: marks tests that validate data values

# Fail fast on first error in connectivity tests
# Remove -x if you want to see all failures
# addopts = -x -v
